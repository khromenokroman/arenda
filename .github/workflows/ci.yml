name: CI

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    name: clang-format и clang-tidy
    runs-on: ubuntu-24.04
    container: debian:bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake clang-format-16 clang-tidy-16 \
            libsqlite3-dev libssl-dev nlohmann-json3-dev libgtest-dev libgmock-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: clang-format
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-16 --style=file --dry-run -Werror

      - name: clang-tidy
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          git ls-files 'src/*.cpp' 'tests/*.cpp' | xargs -P "$(nproc)" -n 1 clang-tidy-16 -p build --quiet

  build:
    name: build-${{ matrix.distro }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            image: debian:bookworm
          - distro: debian13
            image: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake dpkg-dev file curl chromium nodejs fonts-liberation poppler-utils \
            libsqlite3-dev libssl-dev nlohmann-json3-dev libgtest-dev libgmock-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией v${VERSION} в CMakeLists.txt"
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke run
        run: |
          ./build/arenda --version
          ./build/arenda --db /tmp/smoke.db --web web --port 18080 &
          pid=$!
          for i in $(seq 50); do curl -sf http://127.0.0.1:18080/api/version && break; sleep 0.1; done
          curl -sf http://127.0.0.1:18080/ | grep -q "<title>"
          kill "$pid"
          wait "$pid"

      - name: Web pages in headless browser
        run: tests/web_smoke.sh ./build/arenda web

      - name: Web scenarios in headless browser
        run: tests/web_e2e.sh ./build/arenda web

      - name: Print form fits 4 pages
        run: tests/print_pages.sh ./build/arenda web

      - name: Package DEB
        working-directory: build
        run: |
          cpack -G DEB
          for f in *.deb; do mv "$f" "${f%.deb}-${{ matrix.distro }}.deb"; done
          dpkg-deb -I *.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: arenda-${{ matrix.distro }}
          path: build/*.deb
          retention-days: 7

  install:
    name: install-${{ matrix.distro }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            codename: bookworm
          - distro: debian13
            codename: trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download DEB
        uses: actions/download-artifact@v8
        with:
          name: arenda-${{ matrix.distro }}
          path: deb

      - name: Install, upgrade and remove with systemd
        run: tests/deb_install.sh deb ${{ matrix.codename }}

  docker:
    name: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t arenda:ci .

      - name: Run, data, stop, recreate
        run: tests/docker_run.sh arenda:ci

      - name: Push to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/${{ github.repository_owner }}/arenda
          VERSION=${GITHUB_REF_NAME#v}
          docker tag arenda:ci "$IMAGE:$VERSION"
          docker tag arenda:ci "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

  release:
    needs: [ lint, build, install, docker ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: arenda-*
          merge-multiple: true
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: arenda ${{ github.ref_name }}
          files: artifacts/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
